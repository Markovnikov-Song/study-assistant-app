<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="伴学 - AI 学习助手">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="伴学">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>伴学</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f6f8fb;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .boot-state {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .boot-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #2563eb;
      color: #ffffff;
      font-weight: 800;
      font-size: 20px;
    }
    .boot-title {
      font-weight: 700;
      font-size: 17px;
    }
    .boot-copy {
      max-width: 280px;
      font-size: 13px;
      line-height: 1.6;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <div id="app-loading" class="boot-state">
    <div class="boot-mark">伴</div>
    <div class="boot-title">正在打开伴学</div>
    <div class="boot-copy">第一次加载会稍慢，请保持网络连接。</div>
  </div>
  <div id="app-failed" class="boot-state" hidden>
    <div class="boot-mark">!</div>
    <div class="boot-title">页面启动失败</div>
    <div class="boot-copy">请刷新页面，或换用手机自带浏览器、Chrome、Safari 打开。</div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((registrations) => Promise.all(registrations.map((r) => r.unregister())))
        .then(() => {
          if (window.caches) {
            return caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
          }
        })
        .catch(() => {});
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=20260508-2318" async></script>
</body>
</html>
